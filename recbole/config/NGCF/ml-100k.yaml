# ─── NGCF base-model config ────────────────────────────────────────────────────
# Matches RecBole's own config format exactly.
# Run with: python run_recbole.py --config_files configs/NGCF/ml-100k.yaml
model: NGCF

dataset: ml-100k
data_path: dataset/

embedding_size: 64              # (int) The embedding size of users and items.
hidden_size_list: [64,64,64]    # (list of int) The hidden size of each layer in GCN layers.
node_dropout: 0.0               # (float) The dropout rate of node in each GNN layer.
message_dropout: 0.1            # (float) The dropout rate of edge in each GNN layer.
reg_weight: 1e-5                # (float) The L2 regularization weight.

# Training
epochs: 20
train_batch_size: 2048
learner: adam
learning_rate: 0.001
eval_step: 10
stopping_step: 20

# Evaluation
eval_args:
  split:
    RS: [0.8, 0.1, 0.1]
  group_by: user
  order: RO
  mode: full
metrics: [Recall, MRR, NDCG, Hit, Precision]
topk: [10]
valid_metric: MRR@10
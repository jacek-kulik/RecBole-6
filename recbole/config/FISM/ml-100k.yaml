# ─── FISM base-model config ────────────────────────────────────────────────────
# Matches RecBole's own config format exactly.
# Run with: python run_recbole.py --config_files configs/FISM/ml-100k.yaml

model: FISM
dataset: ml-100k
data_path: dataset/

embedding_size: 64
train_neg_sample_args:
  distribution: uniform
  sample_num: 1

# Training
epochs: 20
train_batch_size: 2048
learner: adam
learning_rate: 0.001
eval_step: 10
stopping_step: 20

embedding_size: 64              # (int) The embedding size of users and items.
reg_weights: [0.0001, 0.0001]       # (list of float) The L2 regularization weights.
alpha: 0.0

# Evaluation
eval_args:
  split:
    RS: [0.8, 0.1, 0.1]
  group_by: user
  order: RO
  mode: full
metrics: [Recall, MRR, NDCG, Hit, Precision]
topk: [10]
valid_metric: MRR@10
